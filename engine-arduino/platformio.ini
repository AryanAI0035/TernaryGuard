; TernaryGuard — Arduino Nano PlatformIO Configuration
; Target: ATmega328P (Arduino Nano)
; Phase 5: Embedded ternary inference engine
;
; Two environments provided:
;   nano_old  — old bootloader (ATmega328P, 57600 upload) for genuine/older Nanos
;   nano_new  — new bootloader (ATmega328P, 115200 upload) for CH340-based clones
;
; Check your board and use: pio run -e nano_old  OR  pio run -e nano_new

[platformio]
default_envs = nano_new

; ──────────────── Shared build settings ────────────────
[env]
platform = atmelavr
framework = arduino

build_flags =
    -Os                         ; Optimize for size — every byte counts in 32KB flash
    -Wall                       ; Enable all warnings
    -Wextra
    -DTERNARYGUARD_ARDUINO      ; Preprocessor flag for conditional compilation
    -DF_CPU=16000000UL          ; 16 MHz crystal

monitor_speed = 115200
build_type = release

; ──────────────── Old bootloader (genuine Arduino Nano) ────────────────
[env:nano_old]
board = nanoatmega328
upload_speed = 57600

; ──────────────── New bootloader (CH340-based clones, most common today) ────────────────
[env:nano_new]
board = nanoatmega328new
upload_speed = 115200
