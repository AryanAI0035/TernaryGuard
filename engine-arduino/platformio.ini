; TernaryGuard — Arduino Nano PlatformIO Configuration
; Target: ATmega328P (Arduino Nano)
; Phase 5: Embedded ternary inference engine

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

; Build flags
build_flags =
    -O2                         ; Optimize for size+speed balance
    -Wall                       ; Enable all warnings
    -Wextra
    -DTERNARYGUARD_ARDUINO      ; Preprocessor flag for conditional compilation
    -DF_CPU=16000000UL          ; 16 MHz crystal

; Serial monitor
monitor_speed = 115200

; Upload settings (adjust port as needed)
; upload_port = /dev/cu.usbserial-*
upload_speed = 57600

; Extra build info
build_type = release

; Check RAM/flash after build
extra_scripts = pre:check_size.py
