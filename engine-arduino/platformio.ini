; TernaryGuard — Arduino Nano PlatformIO Configuration
; Target: ATmega328P (Arduino Nano)
; Phase 5: Embedded ternary inference engine
;
; Two environments provided:
;   nano_old  — old bootloader (ATmega328P, 57600 upload) for boards with the old bootloader
;   nano_new  — new bootloader (ATmega328P, 115200 upload) for boards with the new bootloader
;
; Check your board and use: pio run -e nano_old  OR  pio run -e nano_new

[platformio]
default_envs = nano_new

; ──────────────── Shared build settings ────────────────
[env]
platform = atmelavr@5.3.0
framework = arduino
extra_scripts = pre:generate_config.py

build_flags =
    -Os                         ; Optimize for size — every byte counts in 32KB flash
    -ffp-contract=off
    -fno-fast-math
    -fstack-usage
    -Wall                       ; Enable all warnings
    -Wextra
    -DTERNARYGUARD_ARDUINO      ; Preprocessor flag for conditional compilation

monitor_speed = 115200
build_type = release

; ──────────────── Old bootloader (select by installed bootloader) ────────────────
[env:nano_old]
board = nanoatmega328
upload_speed = 57600

; ──────────────── New bootloader (select by installed bootloader) ────────────────
[env:nano_new]
board = nanoatmega328new
upload_speed = 115200
